<script>
    function escapeMenuText(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    (async function renderMemberMenu() {

        const memberMenu =
            document.getElementById("memberMenu");

        const currentUser =
            mockAuth.getCurrentUser();

        if (!memberMenu || !currentUser) {
            return;
        }

        /*
         * 로그인 정보의 닉네임은 이 브라우저(localStorage)에만 저장돼 있어서,
         * 다른 곳에서 닉네임을 바꿨다면 users 문서의 최신 닉네임으로 맞춘다.
         */

        try {

            const profileDoc = await firebase.firestore()
                .collection("users").doc(currentUser.id).get();

            const savedNickname =
                profileDoc.exists ? profileDoc.data().nickname : "";

            if (savedNickname && savedNickname !== currentUser.nickname) {
                currentUser.nickname = savedNickname;
                mockAuth.login(currentUser);
            }

        } catch (error) {
            console.warn("닉네임을 동기화하지 못했습니다(무시):", error.code || error.message);
        }

        const isAdmin =
            await mockAuth.isAdmin();

        const adminLinkHtml = isAdmin
            ? '<a href="admin/index.html">관리자</a>'
            : '';

        memberMenu.innerHTML =
            adminLinkHtml
            + '<a href="mypage.html">마이페이지</a>'
            + '<span class="member-nickname">'
            + escapeMenuText(currentUser.nickname)
            + '님</span>'
            + '<a href="#" id="logoutLink">로그아웃</a>';

        document.getElementById("logoutLink")
            .addEventListener("click", function (event) {

                event.preventDefault();

                mockAuth.logout();

                location.reload();

            });

    })();
</script>

<script src="main/webapp/js/posts-store.js"></script>
<script src="main/webapp/js/author-info.js"></script>

<script>
    const currentUser =
        mockAuth.getCurrentUser();

    const COUNTRY_LABELS = {
        KR: "한국",
        JP: "일본",
        ETC: "기타"
    };

    async function loadProfileView() {

        const doc = await firebase.firestore()
            .collection("users")
            .doc(currentUser.id)
            .get();

        const profile = doc.exists ? doc.data() : {};

        document.getElementById("profileViewNickname").textContent =
            profile.nickname || currentUser.nickname;

        document.getElementById("profileViewBio").textContent =
            profile.bio || "아직 소개가 없습니다.";

        const countryLabel = profile.country === "ETC"
            ? (profile.countryOther || "기타")
            : COUNTRY_LABELS[profile.country] || "-";

        document.getElementById("profileViewCountry").textContent =
            "국가 " + countryLabel;

        const email = profile.emailLocal
            ? profile.emailLocal + "@" + (profile.emailDomain === "custom"
                ? profile.emailDomainOther
                : profile.emailDomain)
            : currentUser.email;

        document.getElementById("profileViewEmail").textContent =
            "이메일 " + email;

        if (profile.photoUrl) {
            document.getElementById("profileViewPhoto").src = profile.photoUrl;
        }

        const personalInfoParts = [];

        if (profile.birthday) {
            personalInfoParts.push(
                "생일 " + profile.birthday
                + (profile.birthdayVisibility === "private" ? " (비공개)" : " (공개)")
            );
        }

        if (profile.name) {
            personalInfoParts.push(
                "이름 " + profile.name
                + (profile.nameVisibility === "private" ? " (비공개)" : " (공개)")
            );
        }

        document.getElementById("profilePersonalInfo").textContent =
            personalInfoParts.join(" · ");

    }

    loadProfileView();

    /*
     * 내가 작성한 글 목록 (본인 글이므로 항상 수정/삭제 버튼을 붙인다)
     */

    function escapeHtml(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    async function loadMyPosts() {

        const posts = await postsStore.getAllPosts();

        const myPosts = posts.filter(function (post) {
            return post.authorUid === currentUser.id;
        });

        const myPostList = document.getElementById("myPostList");

        document.getElementById("myPostsEmpty").hidden = myPosts.length !== 0;

        myPostList.innerHTML = myPosts.map(function (post) {

            const displayDate =
                post.createdAt ? post.createdAt.slice(0, 10).replace(/-/g, ".") : "";

            const detailUrl =
                "posts/detail.html?id=" + encodeURIComponent(post.id);

            return '<article class="story-card">'
                + '<a href="' + detailUrl + '" class="story-image">'
                + '<img src="' + escapeHtml(postsStore.imageSrc(post, "main/webapp/images/")) + '" alt="'
                + escapeHtml(post.title) + '"></a>'
                + '<div class="story-content">'
                + '<span class="story-category">' + escapeHtml(post.countryLabel) + '</span>'
                + '<h3><a href="' + detailUrl + '">' + escapeHtml(post.title) + '</a></h3>'
                + '<p>' + escapeHtml(post.body) + '</p>'
                + '<div class="story-information">'
                + '<span>' + escapeHtml(displayDate) + '</span>'
                + '<span>조회 ' + (Number(post.views) || 0) + '</span>'
                + '<span>좋아요 ' + (Number(post.likes) || 0) + '</span>'
                + '<span>댓글 ' + (Number(post.comments) || 0) + '</span>'
                + '</div>'
                + '<div class="detail-actions local-post-actions">'
                + '<a href="posts/edit.html?id=' + encodeURIComponent(post.id) + '" class="detail-edit-button">수정</a>'
                + '<button type="button" class="detail-delete-button" data-post-id="' + escapeHtml(post.id) + '">삭제</button>'
                + '</div>'
                + '</div></article>';

        }).join("");

    }

    loadMyPosts();

    document.getElementById("myPostList").addEventListener("click", async function (event) {

        const deleteButton = event.target.closest(".detail-delete-button");

        if (!deleteButton) {
            return;
        }

        const isConfirmed =
            confirm("이 게시글을 삭제하시겠습니까?");

        if (!isConfirmed) {
            return;
        }

        const postId = deleteButton.dataset.postId;
        const card = deleteButton.closest(".story-card");
        const postTitle = card.querySelector("h3 a").textContent.trim();

        await postsStore.deletePost(postId, postTitle, currentUser.id, currentUser.nickname);

        loadMyPosts();

    });

    /*
     * 스크랩한 글 목록 (최근에 스크랩한 순).
     * 스크랩 뒤에 원본 글이 삭제된 경우에는 목록에서 빼고 스크랩 기록도 정리한다.
     */

    async function loadScraps() {

        const scrapIds = await postsStore.getMyScrapIds();

        const posts = await postsStore.getAllPosts();

        const postsById = {};

        posts.forEach(function (post) {
            postsById[post.id] = post;
        });

        const scrappedPosts = [];

        scrapIds.forEach(function (postId) {

            if (postsById[postId]) {
                scrappedPosts.push(postsById[postId]);
            } else {
                postsStore.removeScrap(postId).catch(function () {});
            }

        });

        document.getElementById("scrapsEmpty").hidden = scrappedPosts.length !== 0;

        document.getElementById("scrapList").innerHTML = scrappedPosts.map(function (post) {

            const displayDate =
                post.createdAt ? post.createdAt.slice(0, 10).replace(/-/g, ".") : "";

            const detailUrl =
                "posts/detail.html?id=" + encodeURIComponent(post.id);

            return '<article class="story-card">'
                + '<a href="' + detailUrl + '" class="story-image">'
                + '<img src="' + escapeHtml(postsStore.imageSrc(post, "main/webapp/images/")) + '" alt="'
                + escapeHtml(post.title) + '"></a>'
                + '<div class="story-content">'
                + '<span class="story-category">' + escapeHtml(post.countryLabel) + '</span>'
                + '<h3><a href="' + detailUrl + '">' + escapeHtml(post.title) + '</a></h3>'
                + '<p>' + escapeHtml(post.body) + '</p>'
                + '<div class="story-information">'
                + '<span data-nickname-uid="' + escapeHtml(post.authorUid) + '">' + escapeHtml(post.authorNickname) + '</span>'
                + '<span>' + escapeHtml(displayDate) + '</span>'
                + '<span>좋아요 ' + (Number(post.likes) || 0) + '</span>'
                + '<span>댓글 ' + (Number(post.comments) || 0) + '</span>'
                + '</div>'
                + '<div class="detail-actions local-post-actions">'
                + '<button type="button" class="detail-delete-button" data-post-id="' + escapeHtml(post.id) + '">스크랩 해제</button>'
                + '</div>'
                + '</div></article>';

        }).join("");

        resolveNicknames(document.getElementById("scrapList"));

    }

    loadScraps().catch(function (error) {
        console.error("스크랩 목록을 불러오지 못했습니다:", error);
    });

    document.getElementById("scrapList").addEventListener("click", async function (event) {

        const removeButton = event.target.closest(".detail-delete-button");

        if (!removeButton) {
            return;
        }

        await postsStore.removeScrap(removeButton.dataset.postId);

        loadScraps();

    });
</script>
