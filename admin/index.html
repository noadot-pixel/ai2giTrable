<script>
    function escapeMenuText(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    (async function renderMemberMenu() {

        const memberMenu =
            document.getElementById("memberMenu");

        const currentUser =
            mockAuth.getCurrentUser();

        if (!memberMenu || !currentUser) {
            return;
        }

        /*
         * 로그인 정보의 닉네임은 이 브라우저(localStorage)에만 저장돼 있어서,
         * 다른 곳에서 닉네임을 바꿨다면 users 문서의 최신 닉네임으로 맞춘다.
         */

        try {

            const profileDoc = await firebase.firestore()
                .collection("users").doc(currentUser.id).get();

            const savedNickname =
                profileDoc.exists ? profileDoc.data().nickname : "";

            if (savedNickname && savedNickname !== currentUser.nickname) {
                currentUser.nickname = savedNickname;
                mockAuth.login(currentUser);
            }

        } catch (error) {
            console.warn("닉네임을 동기화하지 못했습니다(무시):", error.code || error.message);
        }

        const isAdmin =
            await mockAuth.isAdmin();

        const adminLinkHtml = isAdmin
            ? '<a href="../admin/index.html">관리자</a>'
            : '';

        memberMenu.innerHTML =
            adminLinkHtml
            + '<a href="../mypage.html">마이페이지</a>'
            + '<span class="member-nickname">'
            + escapeMenuText(currentUser.nickname)
            + '님</span>'
            + '<a href="#" id="logoutLink">로그아웃</a>';

        document.getElementById("logoutLink")
            .addEventListener("click", function (event) {

                event.preventDefault();

                mockAuth.logout();

                location.reload();

            });

    })();
</script>
