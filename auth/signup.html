            <div class="auth-panel">

                        <p class="auth-description">

                    <form id="signupForm">

                        <div class="auth-field">
                            <label for="signupNickname">
                                닉네임

                            <input type="text"
                                   id="signupNickname"
                                   name="signupNickname"
                                   placeholder="사용할 닉네임을 입력해 주세요"
                                   autocomplete="nickname">
                        </div>

                        <div class="auth-field">
                            <label for="signupEmail">
                                이메일

                                   id="signupEmail"
                                   name="signupEmail"
                                   placeholder="이메일을 입력해 주세요"

                        </div>

                        <div class="auth-field">
                            <label for="signupPassword">
                                비밀번호
                            </label>

                            <input type="password"
                                   id="signupPassword"
                                   name="signupPassword"
                                   placeholder="6자 이상 입력해 주세요"

                        </div>

                        <div class="auth-field">
                            <label for="signupPasswordConfirm">
                                비밀번호 확인
                            </label>

                            <input type="password"
                                   id="signupPasswordConfirm"
                                   name="signupPasswordConfirm"
                                   placeholder="비밀번호를 다시 입력해 주세요"
                                   autocomplete="new-password">
                        </div>

                        <button type="submit"
                                class="auth-submit">
                            회원가입

                    </form>

                    <div class="auth-divider">

<script src="../main/webapp/js/mock-auth.js"></script>

<script>
    function escapeMenuText(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    (async function renderMemberMenu() {

        const memberMenu =
            document.getElementById("memberMenu");

        const currentUser =
            mockAuth.getCurrentUser();

        if (!memberMenu || !currentUser) {
            return;
        }

        /*
         * 로그인 정보의 닉네임은 이 브라우저(localStorage)에만 저장돼 있어서,
         * 다른 곳에서 닉네임을 바꿨다면 users 문서의 최신 닉네임으로 맞춘다.
         */

        try {

            const profileDoc = await firebase.firestore()
                .collection("users").doc(currentUser.id).get();

            const savedNickname =
                profileDoc.exists ? profileDoc.data().nickname : "";

            if (savedNickname && savedNickname !== currentUser.nickname) {
                currentUser.nickname = savedNickname;
                mockAuth.login(currentUser);
            }

        } catch (error) {
            console.warn("닉네임을 동기화하지 못했습니다(무시):", error.code || error.message);
        }

        const isAdmin =
            await mockAuth.isAdmin();

        const adminLinkHtml = isAdmin
            ? '<a href="../admin/index.html">관리자</a>'
            : '';

        memberMenu.innerHTML =
            adminLinkHtml
            + '<a href="../mypage.html">마이페이지</a>'
            + '<span class="member-nickname">'
            + escapeMenuText(currentUser.nickname)
            + '님</span>'
            + '<a href="#" id="logoutLink">로그아웃</a>';

        document.getElementById("logoutLink")
            .addEventListener("click", function (event) {

                event.preventDefault();

                mockAuth.logout();

                location.reload();

            });

    })();
</script>

<script>
    /*
     * 이미 로그인되어 있으면 메인으로 바로 이동
     */

    if (mockAuth.isLoggedIn()) {
        location.href = "../index.html";
    }
</script>

<script>
    /*
     * 회원가입 목업: 입력값만 검사하고, 가입이 완료된 것처럼 alert를 띄운 뒤
     * 로그인 화면으로 이동한다. (Firebase 계정 생성, DB 기록은 하지 않는다.)
     */

    const signupForm =
        document.getElementById("signupForm");

    const nicknameInput =
        document.getElementById("signupNickname");

    const emailInput =
        document.getElementById("signupEmail");

    const passwordInput =
        document.getElementById("signupPassword");

    const passwordConfirmInput =
        document.getElementById("signupPasswordConfirm");

    signupForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const nickname =
            nicknameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const passwordConfirm =
            passwordConfirmInput.value;

        if (nickname === "" || email === "" || password === "" || passwordConfirm === "") {

            alert("모든 항목을 입력해 주세요.");

            return;
        }

        if (password !== passwordConfirm) {

            alert("비밀번호가 서로 일치하지 않습니다.");

            return;
        }

        if (password.length < 6) {

            alert("비밀번호는 6자 이상이어야 합니다.");

            return;
        }

        alert("회원가입이 완료되었습니다. 로그인해 주세요.");

        location.href = "../auth/login.html";

    });
</script>
