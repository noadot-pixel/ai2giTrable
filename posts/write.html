<script>
    function escapeMenuText(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    (async function renderMemberMenu() {

        const memberMenu =
            document.getElementById("memberMenu");

        const currentUser =
            mockAuth.getCurrentUser();

        if (!memberMenu || !currentUser) {
            return;
        }

        /*
         * 로그인 정보의 닉네임은 이 브라우저(localStorage)에만 저장돼 있어서,
         * 다른 곳에서 닉네임을 바꿨다면 users 문서의 최신 닉네임으로 맞춘다.
         */

        try {

            const profileDoc = await firebase.firestore()
                .collection("users").doc(currentUser.id).get();

            const savedNickname =
                profileDoc.exists ? profileDoc.data().nickname : "";

            if (savedNickname && savedNickname !== currentUser.nickname) {
                currentUser.nickname = savedNickname;
                mockAuth.login(currentUser);
            }

        } catch (error) {
            console.warn("닉네임을 동기화하지 못했습니다(무시):", error.code || error.message);
        }

        const isAdmin =
            await mockAuth.isAdmin();

        const adminLinkHtml = isAdmin
            ? '<a href="../admin/index.html">관리자</a>'
            : '';

        memberMenu.innerHTML =
            adminLinkHtml
            + '<a href="../mypage.html">마이페이지</a>'
            + '<span class="member-nickname">'
            + escapeMenuText(currentUser.nickname)
            + '님</span>'
            + '<a href="#" id="logoutLink">로그아웃</a>';

        document.getElementById("logoutLink")
            .addEventListener("click", function (event) {

                event.preventDefault();

                mockAuth.logout();

                location.reload();

            });

    })();
</script>

<script src="../main/webapp/js/posts-store.js"></script>

<script>
    /*
     * 여행지 구분 / 여행 성향은 각 그룹에서 하나만 선택되도록 처리
     */

    let selectedCountry = null;
    let selectedCountryLabel = null;
    let selectedStyle = null;

    function bindWriteFilterGroup(groupId, onSelect) {

        const group =
            document.getElementById(groupId);

        const buttons =
            group.querySelectorAll(".filter-button");

        buttons.forEach(function (button) {

            button.addEventListener("click", function () {

                buttons.forEach(function (other) {
                    other.classList.remove("active");
                });

                button.classList.add("active");

                onSelect(button);

            });

        });

    }

    bindWriteFilterGroup("writeCountryGroup", function (button) {
        selectedCountry = button.dataset.country;
        selectedCountryLabel = button.dataset.countryLabel;
    });

    bindWriteFilterGroup("writeStyleGroup", function (button) {
        selectedStyle = button.dataset.style;
    });

    /*
     * 사진을 올리지 않았을 때 쓰는 국가별 기본 이미지
     */

    const DEFAULT_IMAGE_BY_COUNTRY = {
        KR: "korea.jpg",
        JP: "japan.jpg",
        ETC: "world.jpg"
    };

    /*
     * 첨부할 사진을 고르면 바로 미리보기를 보여준다.
     * 실제 업로드는 등록할 때 한 번만 일어난다.
     */

    const writePhotoInput =
        document.getElementById("writePhoto");

    const writePhotoPreview =
        document.getElementById("writePhotoPreview");

    writePhotoInput.addEventListener("change", function () {

        const file = writePhotoInput.files[0];

        if (!file) {
            writePhotoPreview.hidden = true;
            return;
        }

        const message = postsStore.validateImageFile(file);

        if (message) {

            alert(message);

            writePhotoInput.value = "";
            writePhotoPreview.hidden = true;

            return;
        }

        writePhotoPreview.src = URL.createObjectURL(file);
        writePhotoPreview.hidden = false;

    });

    const writeForm =
        document.getElementById("writeForm");

    writeForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const title =
            document.getElementById("writeTitle").value.trim();

        const body =
            document.getElementById("writeBody").value.trim();

        if (title === "") {
            alert("제목을 입력해 주세요.");
            return;
        }

        if (!selectedCountry) {
            alert("여행지 구분을 선택해 주세요.");
            return;
        }

        if (!selectedStyle) {
            alert("여행 성향을 선택해 주세요.");
            return;
        }

        if (body === "") {
            alert("본문을 입력해 주세요.");
            return;
        }

        const currentUser =
            mockAuth.getCurrentUser();

        const submitButton =
            writeForm.querySelector('button[type="submit"]');

        submitButton.disabled = true;

        try {

            const post = {
                title: title,
                body: body,
                country: selectedCountry,
                countryLabel: selectedCountryLabel,
                style: selectedStyle,
                authorUid: currentUser.id,
                authorNickname: currentUser.nickname,
                image: DEFAULT_IMAGE_BY_COUNTRY[selectedCountry]
            };

            const photoFile = writePhotoInput.files[0];

            if (photoFile) {
                post.imageUrl = await postsStore.uploadPostImage(photoFile);
            }

            const newPostId = await postsStore.createPost(post);

            alert("게시글이 등록되었습니다.");

            location.href = "../posts/detail.html?id=" + newPostId;

        } catch (error) {

            alert("게시글 등록에 실패했습니다: " + error.message);

            submitButton.disabled = false;

        }

    });
</script>
